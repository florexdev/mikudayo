# =========================================================
# MIKU NIGHT — KITTY
# =========================================================

# -------------------------
# FONT
# -------------------------

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font
italic_font      JetBrainsMono Nerd Font
bold_italic_font JetBrainsMono Nerd Font

font_size 11.5

disable_ligatures never

# -------------------------
# CURSOR
# -------------------------

cursor_shape beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 0

cursor #72F1FF
cursor_text_color #080D18

# -------------------------
# WINDOW
# -------------------------

background #080D18
foreground #EAF7FF

background_opacity 0.88

dynamic_background_opacity yes

window_padding_width 18
window_margin_width 0

hide_window_decorations yes

remember_window_size yes

initial_window_width 1100
initial_window_height 700

# -------------------------
# SELECTION
# -------------------------

selection_foreground #080D18
selection_background #42D9E8

# -------------------------
# LINKS
# -------------------------

url_color #FF6B9D
url_style curly

# -------------------------
# TAB BAR
# -------------------------

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

tab_title_template "{index}: {title}"

active_tab_foreground #080D18
active_tab_background #42D9E8

inactive_tab_foreground #8FA9BC
inactive_tab_background #101A2B

# -------------------------
# COLORS
# -------------------------

color0  #080D18
color1  #FF6B9D
color2  #5FE6AA
color3  #FFBE5A
color4  #42D9E8
color5  #9B6CFF
color6  #72F1FF
color7  #EAF7FF

color8  #34465C
color9  #FF8FB5
color10 #7AF0BA
color11 #FFD27A
color12 #72F1FF
color13 #B394FF
color14 #8CFAFF
color15 #FFFFFF

# -------------------------
# TERMINAL BEHAVIOR
# -------------------------

enable_audio_bell no

visual_bell_duration 0.0

confirm_os_window_close 0

allow_remote_control yes

shell_integration enabled

# -------------------------
# SCROLL
# -------------------------

scrollback_lines 10000

wheel_scroll_multiplier 3.0

# -------------------------
# MOUSE
# -------------------------

mouse_hide_wait 3.0

# -------------------------
# PERFORMANCE
# -------------------------

repaint_delay 10
input_delay 0

sync_to_monitor yes
shell /usr/bin/zsh
